<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>To-Do</title>
</head>
<body>
  <header>
    <div id="header-left">
      <h2>To-Do</h2>
    </div>
    <div id="header-right">
      <button id="header-new-item-btn">Add new item</button>
      <input style="display: none;" type="file" name="import-file-input" id="import-file-input" accept=".csv">
      <label for="import-file-input">
        <button id="header-import-btn">Import from .csv</button>
      </label>
      <button id="header-export-btn">Export to .csv</button>
    </div>
  </header>
  <main>
    <div id="container">
      <!-- JS adds items here -->
       <div class="todo-item">
        <span class="todo-item-title">Title</span>
        <span class="todo-item-description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis expedita voluptatum at enim nisi voluptas maxime. Enim, nostrum maiores! Ut placeat corporis eum, magnam minus architecto mollitia reprehenderit sint necessitatibus.</span>
        <label for="todo-checkbox">Completed?</label>
        <input type="checkbox" name="todo-checkbox" id="todo-checkbox" class="todo-checkbox">
        <button class="todo-edit">Edit</button>
       </div>


      <div id="no-items-placeholder">
        <span>No items yet.</span>
      </div>
    </div>
    <div id="popup-container">
      <form>
        <button id="close-form-btn">X</button>
        <div class="form-group">
          <label for="title-input">Title:</label>
          <input placeholder="Title" type="text" name="title-input" id="title-input">
        </div>
        <div class="form-group">
          <label for="description-input">Description:</label>
          <textarea placeholder="Short description here..." name="description-input" id="description-input"></textarea>
        </div>
        <button id="form-submit">Add</button>
      </form>
    </div>
  </main>
</body>
<script src="script.js"></script>
</html>
