<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>To-Do</title>
</head>
<body>
  <header>
    <div id="header-left">
      <h2>To-Do</h2>
    </div>
    <div id="header-right">
      <button id="header-new-item-btn">+ Add new item</button>
      <input style="display: none;" type="file" name="import-file-input" id="import-file-input" accept=".json">
      <label for="import-file-input">
        <button class="secondary" id="header-import-btn">Import from .json</button>
      </label>
      <button class="secondary" id="header-export-btn">Export to .json</button>
    </div>
  </header>
  <main>
    <div id="container">
      <!-- JS adds items here and hides #no-items-placeholder if needed -->
      <div id="no-items-placeholder">
        <span>No items yet.</span>
        <button id="body-new-item-btn">+ Add new item</button>
      </div>
    </div>
    <div id="popup-container">
      <form>
        <div class="form-group">
          <input placeholder="Title" type="text" name="title-input" id="title-input">
        </div>
        <div class="form-group">
          <textarea rows="5" cols="25" placeholder="Short description here..." name="description-input" id="description-input"></textarea>
        </div>
        <div class="form-group">
          <button id="form-submit">Add</button>
          <button id="close-form-btn">Cancel</button>
        </div>
      </form>
    </div>
  </main>
  <footer>
    <a href="https://github.com/Tyl3rA/To-Do-List" target="_blank"><span>View on Github</span></a>
  </footer>
</body>
<script src="script.js"></script>
</html>
